
name: Actualizar 7 Rioja TV HLS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: actualizar-7rioja
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Generar 7 Rioja 720p con audio
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import urlsplit, parse_qs

          origen = "https://www.dailymotion.com/video/x8dhao1"

          resultado = subprocess.run(
              [
                  "yt-dlp",
                  "--no-config",
                  "--dump-single-json",
                  "--skip-download",
                  origen
              ],
              capture_output=True,
              text=True,
              timeout=120
          )

          if resultado.returncode != 0:
              print(resultado.stderr, flush=True)
              raise RuntimeError("Error al consultar Dailymotion")

          datos = json.loads(resultado.stdout)

          formatos = {
              f["format_id"]: f
              for f in datos["formats"]
              if f.get("url")
          }


          print("FORMATOS DISPONIBLES EN GITHUB ACTIONS:", flush=True)

          for identificador, formato in formatos.items():
              print(
                  f"ID: {identificador} | "
                  f"Resolucion: {formato.get('width')}x{formato.get('height')} | "
                  f"Video: {formato.get('vcodec')} | "
                  f"Audio: {formato.get('acodec')}",
                  flush=True
              )

          video = formatos.get("hls-2")
          audio = formatos.get("hls-group_A2-und")

          if not video or not audio:
              raise RuntimeError(
                  "Faltan pistas HLS 720p o AAC. "
                  "Revisar formatos disponibles arriba."
              )


          url_video = video["url"]
          url_audio = audio["url"]

          for nombre, url in [
              ("video", url_video),
              ("audio", url_audio)
          ]:
              if not url.startswith("https://"):
                  raise RuntimeError(
                      f"URL no valida para {nombre}"
                  )

              fechas = parse_qs(
                  urlsplit(url).query
              ).get("startdate", [])

              print(f"{nombre}: startdate={fechas or 'sin parametro'}")

          ancho = video.get("width") or 1280
          alto = video.get("height") or 720
          codec = video.get("vcodec") or "avc1.64001f"
          bitrate = int((video.get("tbr") or 2179) * 1000)

          playlist = (
              "#EXTM3U\n"
              "#EXT-X-VERSION:3\n"
              '#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="audio",'
              'NAME="Espanol",LANGUAGE="es",'
              'DEFAULT=YES,AUTOSELECT=YES,'
              f'URI="{url_audio}"\n'
              f"#EXT-X-STREAM-INF:BANDWIDTH={bitrate + 128000},"
              f"RESOLUTION={ancho}x{alto},"
              f'CODECS="{codec},mp4a.40.2",'
              'AUDIO="audio"\n'
              f"{url_video}\n"
          )

          Path("7Rioja_master.m3u8").write_text(
              playlist,
              encoding="utf-8"
          )

          print("7 RIOJA TV - GENERACION CORRECTA")
          print(f"Video: {ancho}x{alto}")
          print("Audio: AAC alta calidad")
          print(
              "Actualizacion UTC:",
              datetime.now(timezone.utc).isoformat()
          )
          PY

      - name: Publicar cambios en GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 7Rioja_master.m3u8

          if git diff --cached --quiet; then
            echo "No hay cambios que publicar"
          else
            git commit -m "Actualizar 7 Rioja TV 720p"
            git push
          fi
