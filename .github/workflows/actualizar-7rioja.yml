
      - name: Obtener enlaces y generar M3U8
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          origen = "https://www.dailymotion.com/video/x8dhao1"

          resultado = subprocess.run(
              [
                  "yt-dlp",
                  "--no-config",
                  "--dump-single-json",
                  "--skip-download",
                  origen
              ],
              capture_output=True,
              text=True,
              check=False,
              timeout=120
          )

          if resultado.returncode != 0:
              print(resultado.stderr, flush=True)
              raise RuntimeError("Error al consultar Dailymotion")

          datos = json.loads(resultado.stdout)

          formatos = {
              f["format_id"]: f
              for f in datos["formats"]
              if f.get("url")
          }

          audio = formatos.get("hls-group_A2-und")

          if not audio:
              raise RuntimeError("Audio AAC no disponible")

          video = None

          for calidad in ["hls-4", "hls-3", "hls-2", "hls-1", "hls-0"]:
              if calidad in formatos:
                  video = formatos[calidad]
                  break

          if not video:
              raise RuntimeError("Video HLS no disponible")

          ancho = video.get("width")
          alto = video.get("height")

          if not ancho or not alto:
              raise RuntimeError("Resolucion desconocida")

          codec_video = video.get("vcodec", "avc1.64001e")
          bitrate = int((video.get("tbr") or 1500) * 1000)

          contenido = (
              "#EXTM3U\n"
              "#EXT-X-VERSION:6\n"
              '#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="audio",'
              'NAME="Espanol",DEFAULT=YES,AUTOSELECT=YES,'
              f'URI="{audio["url"]}"\n'
              f"#EXT-X-STREAM-INF:BANDWIDTH={bitrate + 128000},"
              f"RESOLUTION={ancho}x{alto},"
              f'CODECS="{codec_video},mp4a.40.2",'
              'AUDIO="audio"\n'
              f'{video["url"]}\n'
          )

          Path("7Rioja_master.m3u8").write_text(
              contenido,
              encoding="utf-8"
          )

          print(f"Video seleccionado: {ancho}x{alto}")
          print("Audio AAC seleccionado")
          print("Archivo M3U8 generado correctamente")
          PY
