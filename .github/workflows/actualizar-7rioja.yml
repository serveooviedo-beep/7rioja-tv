
name: Actualizar 7 Rioja TV

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Obtener enlaces y generar M3U8
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          origen = "https://www.dailymotion.com/video/x8dhao1"

          comando = [
              "yt-dlp",
              "--no-config",
              "--verbose",
              "-F",
              origen
          ]

          resultado = subprocess.run(
              comando,
              capture_output=True,
              text=True,
              check=False,
              timeout=120
          )
          ("FORMATOS DISPONIBLES EN GITHUB:")
          print(resultado.stdout, flush=True)
          print(resultado.stderr, flush=True)
          if resultado.returncode != 0:
              print("ERROR ORIGINAL DE YT-DLP:")
              print(resultado.stderr, flush=True)
              raise RuntimeError(
                  f"yt-dlp terminó con código {resultado.returncode}"
              )
          urls = [
              linea.strip()
              for linea in resultado.stdout.splitlines()
              if linea.strip().startswith("https://")
          ]

          video = next(
              (url for url in urls if "live-h264-1080.m3u8" in url),
              None
          )

          audio = next(
              (url for url in urls if "live-aac-128.m3u8" in url),
              None
          )

          if not video or not audio:
              raise RuntimeError(
                  "No se encontraron las pistas de video y audio"
              )

          playlist = (
              "#EXTM3U\n"
              "#EXT-X-VERSION:6\n"
              '#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="audio",'
              'NAME="Espanol",LANGUAGE="es",'
              'DEFAULT=YES,AUTOSELECT=YES,'
              f'URI="{audio}"\n'
              "#EXT-X-STREAM-INF:BANDWIDTH=6500000,"
              'RESOLUTION=1920x1080,'
              'CODECS="avc1.640028,mp4a.40.2",'
              'AUDIO="audio"\n'
              f"{video}\n"
          )

          Path("7Rioja_master.m3u8").write_text(
              playlist,
              encoding="utf-8"
          )

          print("M3U8 generado correctamente")
          print("Video 1080p y audio AAC detectados")
          PY

      - name: Publicar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 7Rioja_master.m3u8

          if git diff --cached --quiet; then
            echo "No hay cambios"
          else
            git commit -m "Actualizar enlaces de 7 Rioja TV"
            git push
          fi
