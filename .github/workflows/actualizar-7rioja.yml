
name: Actualizar 7 Rioja TV

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Obtener enlaces y generar M3U8
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess

          url = "https://www.dailymotion.com/video/x8dhao1"

          result = subprocess.run(
              ["yt-dlp", "--no-config", "--dump-single-json",
               "--skip-download", url],
              capture_output=True,
              text=True,
              check=True,
          )

          data = json.loads(result.stdout)
          formats = {
              f["format_id"]: f["url"]
              for f in data["formats"]
              if f.get("url")
          }

          video = formats["hls-4"]
          audio = formats["hls-group_A2-und"]

          playlist = (
              "#EXTM3U\n"
              "#EXT-X-VERSION:6\n"
              '#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="audio",'
              'NAME="Espanol",DEFAULT=YES,AUTOSELECT=YES,'
              f'URI="{audio}"\n'
              "#EXT-X-STREAM-INF:BANDWIDTH=6500000,"
              'RESOLUTION=1920x1080,CODECS="avc1.640028,mp4a.40.2",'
              'AUDIO="audio"\n'
              f"{video}\n"
          )

          with open("7Rioja_master.m3u8", "w",
                    encoding="utf-8", newline="\n") as file:
              file.write(playlist)

          print("Manifiesto M3U8 generado correctamente")
          PY

      - name: Publicar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 7Rioja_master.m3u8
          if git diff --cached --quiet; then
            echo "No hay cambios"
          else
            git commit -m "Actualizar enlaces de 7 Rioja TV"
            git push
          fi
